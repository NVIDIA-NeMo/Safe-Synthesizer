- column: EmailMessage.RelatedToId
  type_column: EmailMessage.RelatedToType
  targets:
  - type_value: Account
    domain: Account.Id
  - type_value: Asset
    domain: Asset.Id
  - type_value: Campaign
    domain: Campaign.Id
  - type_value: Case
    domain: Case.Id
  - type_value: Contract
    domain: Contract.Id

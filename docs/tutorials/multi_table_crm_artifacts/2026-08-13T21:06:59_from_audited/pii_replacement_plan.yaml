# PII replacement plan for this dataset. Edit and pass back via
# replace_pii.replacement_plan to override auto-discovery.

# How widely one original value keeps the same synthetic value:
# record (per row), group (per training group), dataframe (whole table),
# or database (multi-table folder + schema via MultiTablePiiReplacer).
scope: database

# Database scope only: equivalence classes of table-qualified columns that
# share one original→synthetic map (from schema PK/FK, plus optional overlap).
# person_reference=true hangs person attribute bundles off keys in the domain.
# Ordinary FK child columns appear here; polymorphic Id columns do not.
key_domains:
- id: Account.Id
  columns:
  - Account.Id
  - Account.ParentId
  - AccountContactRelation.AccountId
  - AccountTeamMember.AccountId
  - Asset.AccountId
  - Case.AccountId

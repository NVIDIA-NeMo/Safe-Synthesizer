instances:
- url: nemo-safe-synthesizer.docs.buildwithfern.com
  multi-source: true
title: NeMo Safe Synthesizer
global-theme: nvidia
logo:
  href: /nightly/home
  right-text: NeMo Safe Synthesizer
navbar-links:
- type: github
  value: https://github.com/NVIDIA-NeMo/Safe-Synthesizer
versions:
- display-name: nightly
  path: versions/nightly.yml
  slug: nightly

redirects:
  # Generated by utils/generate_redirects.py — re-run from repo root; see scripts README
  - source: "/index.html"
    destination: "/nightly/home"
  - source: "/index"
    destination: "/nightly/home"
  - source: "/nightly/:path*/index.html"
    destination: "/nightly/:path*"
  - source: "/:path*/index.html"
    destination: "/:path*"
  # Sphinx page URLs (foo.html); must follow all :path*/index.html rules above
  - source: "/:path*.html"
    destination: "/:path*"

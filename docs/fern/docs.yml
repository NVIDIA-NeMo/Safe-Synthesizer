instances:
- url: nvidia-nemo-safe-synthesizer.docs.buildwithfern.com/nemo/safe-synthesizer
  custom-domain: docs.nvidia.com/nemo/safe-synthesizer
  multi-source: true
title: NeMo Safe Synthesizer
global-theme: nvidia
logo:
  href: /nightly/home
  right-text: NeMo Safe Synthesizer
navbar-links:
- type: github
  value: https://github.com/NVIDIA-NeMo/Safe-Synthesizer
versions:
- display-name: nightly
  path: versions/nightly.yml
  slug: nightly

redirects:
  - source: "/nemo/safe-synthesizer/index.html"
    destination: "/nemo/safe-synthesizer/nightly/home"
  - source: "/nemo/safe-synthesizer/index"
    destination: "/nemo/safe-synthesizer/nightly/home"
  - source: "/nightly/:path*/index.html"
    destination: "/nightly/:path*"
  - source: "/:path*/index.html"
    destination: "/:path*"
  # Sphinx page URLs (foo.html); must follow all :path*/index.html rules above
  - source: "/:path*.html"
    destination: "/:path*"

generated_extras = ["engine", "cpu", "cu129", "cu130"]

# CUDA Python packaging context:
# - Starting with CUDA Python 12.8, cuda-python is a metapackage that currently
#   depends on cuda-bindings; the newer docs describe split components such as
#   cuda.core, cuda.bindings, and cuda.pathfinder.
# - CUDA 13.x optional Toolkit components are installed through the cuda-toolkit
#   PyPI metapackage, and current NVIDIA package names are generally unsuffixed
#   (for example, nvidia-cuda-nvrtc and nvidia-nvjitlink).
# - Keep NVIDIA package routing per-library: nvidia-cublas is unsuffixed for both
#   CUDA 12 and CUDA 13, while other CUDA 12 runtime packages may still need a
#   -cu12 suffix and CUDA-specific PyTorch indexes.
# - CUDA 13.x bindings require Linux driver 580.65.06 or newer.
nvidia_cuda_libraries = [
  { name = "cublas", nvidia_package_suffix = "", index = "nvidia-pypi-public" },
  "cuda-cupti",
  "cuda-nvrtc",
  "cuda-nvprof",
  "cuda-runtime",
  "cuda-nvml",
  "cudnn",
  "cusparse",
  "cusparselt",
  "nccl",
  "nvjitlink",
  "nvshmem",
  "nvtx",
]

conflict_extras = ["cpu"]

[cpu]
dependencies = [
  { name = "torch", version = "2.11.0", sys_platform = "darwin" },
  { name = "torch", version = "2.11.0", local = "cpu", sys_platform = "linux", index = "pytorch-cpu", source_marker = "sys_platform=='linux'" },
  { name = "torchvision", version = "0.26.0", sys_platform = "darwin" },
  { name = "torchvision", version = "0.26.0", local = "cpu", sys_platform = "linux", index = "pytorch-cpu" },
  "torchao==0.17.0",
]

[[indexes]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[indexes]]
name = "nv-shared-pypi-local"
url = "https://urm.nvidia.com/artifactory/api/pypi/nv-shared-pypi-local/simple"
explicit = true

[[indexes]]
name = "nvidia-pypi-public"
url = "https://pypi.nvidia.com"
explicit = true

[cuda_indexes.pytorch]
name = "pytorch-{extra}"
url = "https://download.pytorch.org/whl/{extra}"
explicit = true

[cuda_indexes.flashinfer]
name = "flashinfer-{extra}"
url = "https://flashinfer.ai/whl/{extra}"
explicit = true

[variants.cu129]
cuda_package_suffix = "cu12"

[variants.cu130]
cuda_package_suffix = "cu13"
nvidia_package_suffix = ""

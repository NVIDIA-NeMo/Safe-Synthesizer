[format]
description = "Format the code (ruff format + lint fix + copyright headers)"
run = [
  "bash tools/codestyle/format.sh",
  "uv run --script tools/codestyle/copyright_fixer.py .",
]

["format-check"]
description = "Check formatting, lint rules, and copyright headers (read-only)"
run = [
  "bash tools/codestyle/format.sh --check",
  "bash tools/codestyle/ruff_check.sh",
  "uv run --script tools/codestyle/copyright_fixer.py --check .",
]

[typecheck]
description = "Run ty type checks"
run = "bash tools/codestyle/typecheck.sh"

["lock-check"]
description = "Check that uv.lock is up to date"
run = [
  "uv lock",
  "git diff --exit-code uv.lock",
]

[check]
description = "Run all read-only CI checks locally"
run = [{ task = "format-check" }, { task = "typecheck" }]

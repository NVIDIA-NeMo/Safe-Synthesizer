["test:tool-install"]
description = "Verify mise-managed tools install correctly in a container"
alias = "test-tool-install"
run = [
  { task = "container:build:test-setup" },
  '''
#!/usr/bin/env bash
set -euo pipefail

container_cmd="${CONTAINER_CMD:-$(command -v podman 2>/dev/null || command -v docker 2>/dev/null || true)}"
if [[ -z "${container_cmd}" ]]; then
  echo "Error: neither podman nor docker was found" >&2
  exit 1
fi

"${container_cmd}" run \
  --rm \
  --platform "${CONTAINER_TEST_PLATFORM:-linux/amd64}" \
  "${CONTAINER_TEST_IMAGE_SETUP:-nss-test-setup:latest}" \
  bash -c '
    echo "=== Verifying installed tools ===" &&
    mise --version &&
    uv --version &&
    ruff --version &&
    ty --version &&
    jq --version &&
    yq --version &&
    gh --version &&
    osv-scanner --version &&
    echo "=== All tools OK ==="'
''',
]

["test:ci-container"]
description = "Run CI unit tests in a Linux container"
alias = "test-ci-container"
run = [
  { task = "container:build:test" },
  '''
#!/usr/bin/env bash
set -euo pipefail

container_cmd="${CONTAINER_CMD:-$(command -v podman 2>/dev/null || command -v docker 2>/dev/null || true)}"
if [[ -z "${container_cmd}" ]]; then
  echo "Error: neither podman nor docker was found" >&2
  exit 1
fi
repo_root="$(pwd -P)"

"${container_cmd}" run \
  --rm \
  --platform "${CONTAINER_TEST_PLATFORM:-linux/amd64}" \
  --mount "type=bind,source=${repo_root},target=/workspace" \
  -e DEBIAN_FRONTEND=noninteractive \
  "${CONTAINER_TEST_IMAGE:-nss-test:latest}" \
  mise run test:ci
''',
]


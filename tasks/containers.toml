["container:build:test"]
description = "Build the full container image for running CI tests locally"
alias = "container-build-test"
run = '''
#!/usr/bin/env bash
set -euo pipefail

container_cmd="${CONTAINER_CMD:-$(command -v podman 2>/dev/null || command -v docker 2>/dev/null || true)}"
if [[ -z "${container_cmd}" ]]; then
  echo "Error: neither podman nor docker was found" >&2
  exit 1
fi

"${container_cmd}" build \
  --platform "${CONTAINER_TEST_PLATFORM:-linux/amd64}" \
  --progress=plain \
  -f "${CONTAINER_TEST_FILE:-containers/Dockerfile.test_ci}" \
  --tag "${CONTAINER_TEST_IMAGE:-nss-test:latest}" \
  .
'''

["container:build:test-setup"]
description = "Build only the setup stage (tools, no Python deps)"
alias = "container-build-test-setup"
run = '''
#!/usr/bin/env bash
set -euo pipefail

container_cmd="${CONTAINER_CMD:-$(command -v podman 2>/dev/null || command -v docker 2>/dev/null || true)}"
if [[ -z "${container_cmd}" ]]; then

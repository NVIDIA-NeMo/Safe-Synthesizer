["container:run:gpu"]
description = "Run command in GPU container"
alias = "container-run-gpu"
usage = 'arg "[cmd]" var=#true double_dash="optional" help="Command to run in the container"'
run = [
  { task = "container:build:gpu" },
  '''
#!/usr/bin/env bash
set -euo pipefail

container_cmd="${CONTAINER_CMD:-$(command -v podman 2>/dev/null || command -v docker 2>/dev/null || true)}"
if [[ -z "${container_cmd}" ]]; then
  echo "Error: neither podman nor docker was found" >&2
  exit 1
fi

hf_cache="${CONTAINER_HF_CACHE:-${HOME}/.cache/huggingface}"
mkdir -p "${hf_cache}"
repo_root="$(pwd -P)"

extra_mounts=()
if [[ -n "${CONTAINER_EXTRA_MOUNTS:-}" ]]; then
  read -r -a extra_mounts <<< "${CONTAINER_EXTRA_MOUNTS}"
fi

gpu_flags=()
read -r -a gpu_flags <<< "${CONTAINER_GPU_FLAG:---gpus all}"

cmd=()
if [[ -n "${usage_cmd:-}" ]]; then
  read -r -a cmd <<< "${usage_cmd}"
elif [[ -n "${CMD:-}" ]]; then
  read -r -a cmd <<< "${CMD}"
else
  cmd=(--help)
fi

"${container_cmd}" run \
  --rm \
  --platform "${CONTAINER_GPU_PLATFORM:-linux/amd64}" \
  --shm-size=1g \
  --mount "type=bind,source=${repo_root},target=/workspace" \
  --mount "type=bind,source=${hf_cache},target=/workspace/.hf_cache" \
  -e HF_HOME=/workspace/.hf_cache \
  -e DEBIAN_FRONTEND=noninteractive \
  "${gpu_flags[@]}" \
  "${extra_mounts[@]}" \
  -w /workspace \
  "${CONTAINER_GPU_IMAGE:-nss-gpu:latest}" \
  "${cmd[@]}"
''',
]


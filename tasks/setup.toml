[setup]
description = "Install dev tools via mise"
run = [
  "MISE_YES=1 mise trust",
  "MISE_YES=1 mise install",
  { task = "venv" },
  "echo 'tools and virtual environment installed successfully via mise'",
]

["bootstrap-tools"]
description = "(legacy alias) Bootstrap tools via mise"
depends = ["setup"]
run = "true"

["bootstrap-tools-ci"]
description = "(legacy alias) Bootstrap tools via mise"
depends = ["setup"]
run = "true"

["clean-python"]
description = "Remove Python virtual environment"
run = '''
#!/usr/bin/env bash
set -euo pipefail

venv_path="${UV_PROJECT_ENVIRONMENT:-${MISE_CONFIG_ROOT:?MISE_CONFIG_ROOT is required}/.venv}"
if [[ -z "${venv_path}" || "${venv_path}" == "/" ]]; then
  echo "Error: refusing to remove invalid virtualenv path: '${venv_path}'" >&2
  exit 1
fi
rm -rf "${venv_path}"
'''

["clean-uv"]
description = "Remove uv cache files"
run = "uv cache clear"

["clean-cache"]
description = "Remove cache files from uv and other tools"
run = [{ task = "clean-uv" }, { task = "clean-python" }]

["verify-python-version"]
description = "Verify Python version and install if necessary"
hide = true
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ -n "${PYTHON_VERSION:-}" ]]; then
  python_version="${PYTHON_VERSION}"
elif [[ -f "${MISE_CONFIG_ROOT}/.python-version" ]]; then
  python_version="$(tr -d '[:space:]' < "${MISE_CONFIG_ROOT}/.python-version")"
else
  echo "Error: PYTHON_VERSION is unset and ${MISE_CONFIG_ROOT}/.python-version does not exist" >&2
  exit 1
fi

if [[ -z "${python_version}" ]]; then
  echo "Error: Python version is empty" >&2
  exit 1
fi
uv python find "${python_version}" || uv python install "${python_version}"
'''

[venv]
description = "Create a Python virtual environment"
hide = true
depends = ["verify-python-version"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ -n "${PYTHON_VERSION:-}" ]]; then
  python_version="${PYTHON_VERSION}"
elif [[ -f "${MISE_CONFIG_ROOT}/.python-version" ]]; then
  python_version="$(tr -d '[:space:]' < "${MISE_CONFIG_ROOT}/.python-version")"
else
  echo "Error: PYTHON_VERSION is unset and ${MISE_CONFIG_ROOT}/.python-version does not exist" >&2
  exit 1
fi

if [[ -z "${python_version}" ]]; then
  echo "Error: Python version is empty" >&2
  exit 1
fi
uv venv --seed --allow-existing --python "${python_version}" "${UV_PROJECT_ENVIRONMENT:-${MISE_CONFIG_ROOT}/.venv}"
'''

["bootstrap-python"]
description = "Bootstrap Python dependencies using PYTORCH_DEPS"
depends = ["venv"]
run = '''
#!/usr/bin/env bash
set -euo pipefail

pytorch_deps="${PYTORCH_DEPS:-}"
if [[ -z "${pytorch_deps}" ]]; then
  case "$(uname -m)" in
    x86_64|amd64)
      pytorch_deps="cu129"
      ;;
    *)
      pytorch_deps="cpu"
      ;;
  esac
fi

uv sync --frozen --extra "${pytorch_deps}" --extra engine --group dev
'''

["bootstrap-nss"]
description = "Bootstrap Python dependencies"
usage = '''
arg "<extra>" help="Python dependency profile" {
  choices "dev" "engine" "cpu" "cuda" "cu129"
}
'''
run = [
  { task = "venv" },
  '''
#!/usr/bin/env bash
set -euo pipefail

echo "~~~~~~"
echo "attempting to install nss package with primary extra: ${usage_extra?}"

case "${usage_extra?}" in
  cuda|cu129)
    uv sync --frozen --extra cu129 --extra engine --group dev
    ;;
  cpu)
    uv sync --frozen --extra cpu --extra engine --group dev
    ;;
  engine)
    uv sync --frozen --extra engine --group dev
    ;;
  dev)
    uv sync --frozen --group dev
    ;;
  *)
    echo "Error: Invalid extra '${usage_extra?}'. Use one of: dev engine cpu cuda cu129" >&2
    exit 1
    ;;
esac
''',
]

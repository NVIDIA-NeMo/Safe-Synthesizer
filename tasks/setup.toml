[setup]
description = "Install dev tools via mise"
run = [
  "MISE_YES=1 mise trust",
  "MISE_YES=1 mise install",
  { task = "venv" },
  "echo 'tools and virtual environment installed successfully via mise'",
]

["bootstrap-tools"]
description = "(legacy alias) Bootstrap tools via mise"
depends = ["setup"]
run = "true"

["bootstrap-tools-ci"]
description = "(legacy alias) Bootstrap tools via mise"
depends = ["setup"]
run = "true"

["clean-uv"]
description = "Remove uv cache files"
run = "uv cache clear"

["clean-cache"]
description = "Remove cache files from uv and other tools"
run = [{ task = "clean-uv" }, { task = "clean-python" }]

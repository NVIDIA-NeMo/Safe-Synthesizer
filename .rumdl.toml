[global]
flavor = "standard"
# Named files, as hooks pass them, still honor exclude, which adoption sets to what the baseline's checks skip.
force-exclude = true
disable = ["MD013", "MD014", "MD024", "MD025", "MD026", "MD031", "MD033", "MD036", "MD041"]
exclude = [
    "vendor/**",
    "third_party/**",
    "uv.lock",
    "mise.lock",
    "LICENSE",
    "**/skill.oms.sig",
    "docs/**/*.markdown",
    "docs/**/*.md",
    "docs/**/*.mdx",
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "**/*.ipynb",
]

[MD004]
style = "dash"

[MD029]
style = "ordered"

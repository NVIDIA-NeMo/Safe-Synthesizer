default_install_hook_types: [pre-commit, commit-msg, pre-push]
# The skills under .agents/skills/ are tracked although .gitignore lists them, so the
# lint and format checks skip them; keep the hooks off them too.
exclude: '^\.agents/skills/'


repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        args:
          - --assume-in-merge

      - id: end-of-file-fixer
        types: [text]
        files: &whitespace-files '(\.(py|pyi|sh|toml|yaml|yml|md|mdx|markdown|mdc|rst|txt|json|ini|in|js|ts|tsx|css|html|j2|template)|(^|/)(Makefile|Dockerfile|Dockerfile\.[^/]*|\.gitignore|\.gitattributes|\.dockerignore))$'
        exclude: &whitespace-exclude '(^|/)(uv\.lock|mise\.lock|LICENSE|skill\.oms\.sig)(/|$)|^(vendor|third_party|docs/assets)/|\.(csv|tsv|lock)(/|$)|(^|/)(\.bzr|\.direnv|\.eggs|\.git|\.git-rewrite|\.hg|\.ipynb_checkpoints|\.mypy_cache|\.nox|\.pants\.d|\.pyenv|\.pytest_cache|\.pytype|\.ruff_cache|\.svn|\.tox|\.venv|\.vscode|__pypackages__|_build|buck-out|build|dist|node_modules|site-packages|venv)(/|$)|^(docs/(.*/)?.*\.markdown|docs/(.*/)?.*\.md|docs/(.*/)?.*\.mdx|(.*/)?.*\.ipynb)(/|$)'

      - id: mixed-line-ending
        args: [--fix=lf]
        types: [text]
        files: *whitespace-files
        exclude: *whitespace-exclude

      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md,mdx,markdown"]
        types: [text]
        files: *whitespace-files
        exclude: *whitespace-exclude


  - repo: local
    hooks:

      - id: ruff-check
        name: Ruff lint and import sorting
        entry: sh .house-tool.sh ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]

      - id: ruff-format
        name: Ruff format, and the Python in Markdown
        entry: sh .house-tool.sh ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        exclude: '\.(mdx|markdown)$'

      - id: rumdl
        name: Format and lint Markdown with rumdl
        entry: sh .house-tool.sh rumdl check --fix
        language: system
        files: '\.(md|mdx|markdown)$'

      - id: dprint
        name: Format TOML with dprint
        entry: sh .house-tool.sh dprint fmt --allow-no-files
        language: system
        files: '\.toml$'

      - id: typecheck
        name: Run ty typechecks
        entry: sh .house-tool.sh ty check
        language: system
        pass_filenames: false
        types: [python]

      - id: copyright-fix
        name: Fix copyright headers
        entry: uv run --script tools/codestyle/copyright_fixer.py
        language: system
        pass_filenames: true
        files: '\.(py|sh|md|yaml|yml)$'
        exclude: |
          (?x)(
              CITATION.md|
              CONTRIBUTING.md|
              CODE_OF_CONDUCT.md|
              design.md|
              CLAUDE.md|
              AGENTS.md|
              CHANGELOG.md|
              DCO|
              LICENSE|
              README.md|
              SECURITY.md|
              THIRD_PARTY.md
          )$

      - id: uv-lock
        name: Check generated CUDA metadata and uv.lock
        entry: mise run check:lock
        language: system
        files: '^(pyproject\.toml|cuda_deps\.toml)$'
        pass_filenames: false
        verbose: true

      - id: check-signoff
        name: Check commit is signed off (DCO)
        entry: "grep -qE '^Signed-off-by: .+ <.+>'"
        language: system
        stages: [commit-msg]
        always_run: true

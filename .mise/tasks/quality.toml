[format]
description = "Format and fix all source files with dprint (TOML), Ruff (Python and the Python in Markdown), rumdl (Markdown), and the SPDX copyright fixer. Modifies files in place; run before committing."
run = [
    "dprint fmt",
    "ruff check --fix",
    "ruff format",
    "rumdl check --fix .",
    "uv run --script tools/codestyle/copyright_fixer.py .",
]

["check:format"]
description = "Check TOML, Python, and Python-in-Markdown formatting with dprint and Ruff without modifying tracked files."
run = [
    "dprint check",
    "ruff format --check",
]

["check:lint"]
description = "Check Python lint rules with Ruff and Markdown format and lint rules with rumdl without modifying tracked files."
run = [
    "ruff check",
    "rumdl check .",
]

["check:type"]
description = "Run ty type checks under the root ty.toml. Requires Python dependencies installed; does not modify files."
run = "ty check"

["check:lock"]
description = "Verify generated CUDA metadata and uv.lock match their sources without modifying tracked files."
run = [
    "uv run --offline --frozen tools/gen_cuda_deps.py cuda_deps.toml --pyproject pyproject.toml --installer install_nss.sh --check",
    "uv lock --check",
]

["check:license:headers"]
description = "Check SPDX copyright headers without modifying tracked files."
run = "uv run --script tools/codestyle/copyright_fixer.py --check ."

["check:tasks"]
description = "Validate public Mise task definitions and usage declarations without modifying tracked files."
run = "mise tasks validate"

["lock:update"]
description = "Regenerate uv.lock from pyproject.toml. Modifies uv.lock in place."
run = "uv lock"

[check]
description = "Run all read-only format, lint, type, lock, license-header, and Mise task checks. Dependencies may run in parallel."
depends = [
    "check:format",
    "check:lint",
    "check:type",
    "check:lock",
    "check:license:headers",
    "check:tasks",
]
run = "echo 'quality checks passed'"

["docs:serve"]
description = "Serve the MkDocs site locally with live reload at http://127.0.0.1:8000. Requires docs dependencies."
alias = "docs-serve"
run = "uv run --frozen --group docs mkdocs serve --livereload"

["docs:build"]
description = "Build the MkDocs site into site/. Read-only for source files; overwrites generated site output."
alias = "docs-build"
run = "uv run --frozen --group docs mkdocs build"

["docs:deploy"]
description = "Deploy the latest docs to GitHub Pages with mike. Requires git push permission and docs dependencies."
alias = "docs-deploy"
run = [
    "uv run --frozen --group docs mike deploy --push --update-aliases main latest",
    "uv run --frozen --group docs mike set-default --push latest",
]

["docs:fern:preview"]
description = "Generate a hosted Fern preview. Run docs:fern:check first; requires Fern authentication."
dir = "docs/fern"
run = "fern generate --docs --preview"

["docs:fern:serve"]
description = "Preview the staged Fern site locally."
dir = "docs/fern"
run = "fern docs dev"

["docs:fern:notebooks"]
description = "Regenerate Fern tutorial reading pages from notebooks without executing cells."
run = "uv run --no-project tools/docs/export_fern_notebooks.py"

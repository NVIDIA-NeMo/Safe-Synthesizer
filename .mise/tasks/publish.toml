["publish:check:internal-env"]
description = "Verify Artifactory publish credentials are present before uploading a wheel. Hidden helper for publish:internal."
hide = true
run = '''
#!/usr/bin/env bash
set -euo pipefail

: "${TWINE_REPOSITORY_URL:?TWINE_REPOSITORY_URL is not set. Set it to the URL of the Artifactory repository.}"
: "${TWINE_USERNAME:?TWINE_USERNAME is not set. Set it to the username for the Artifactory repository.}"
: "${TWINE_PASSWORD:?TWINE_PASSWORD is not set. Set it to the password for the Artifactory repository.}"
'''

["publish:check:pypi-env"]
description = "Verify PyPI publish credentials are present before uploading a wheel. Hidden helper for publish:pypi."
hide = true
run = '''
#!/usr/bin/env bash
set -euo pipefail

: "${TWINE_USERNAME:?TWINE_USERNAME is not set. For PyPI token auth, set TWINE_USERNAME=__token__.}"
: "${TWINE_PASSWORD:?TWINE_PASSWORD is not set. For PyPI token auth, set TWINE_PASSWORD=<your-pypi-token>.}"
'''

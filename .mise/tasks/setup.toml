[setup]
description = "Set up a development checkout: install the pinned Mise tools, sync every dependency group and extra (deps:sync all), and install the Git hooks. Takes no arguments; run make setup first on a new machine."
run = [
    "MISE_YES=1 mise install",
    { task = "deps:sync", args = ["all"] },
    { task = "hooks:install" },
]

["hooks:install"]
description = "Install the Git hooks with prek. Hooks install into .git/hooks; a leftover core.hooksPath silently disables them, so unset it first."
run = "prek install"

["bootstrap-tools"]
description = "(legacy alias) Set up the checkout via setup"
hide = true
depends = ["setup"]
run = "true"

["bootstrap-tools-ci"]
description = "(legacy alias) Install the pinned Mise tools; installs no hooks"
hide = true
run = "MISE_YES=1 mise install"

["clean-uv"]
description = "Remove uv cache files. Frees disk space; future uv operations will re-download packages."
run = "uv cache clear"

["clean-cache"]
description = "Remove uv cache files and the Python virtualenv. Frees disk space; future setup/bootstrap tasks recreate state."
run = [{ task = "clean-uv" }, { task = "clean-python" }]

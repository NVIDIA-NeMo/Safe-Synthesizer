["test-nss-mistral_nodp-dow_jones_index-ci"]
description = "Run pytest test for mistral-nodp config with dow-jones-index dataset"
run = [{ task = "test:nss-config-dataset", args = ["mistral_nodp", "dow_jones_index"] }]

["test-nss-mistral_dp-clinc_oos-ci"]

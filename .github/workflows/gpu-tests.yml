# ---------------------------------------------------------------------------
# GPU tests run on NVIDIA on-prem self-hosted runners and use the copy-pr-bot
# pattern: PRs are tested via push events to pull-request/* branches rather
# than pull_request events.
# See: https://docs.gha-runners.nvidia.com/platform/apps/copy-pr-bot/
# ---------------------------------------------------------------------------

name: GPU Tests

on:
  schedule:
    # Nightly at 02:00 UTC.
    - cron: '0 2 * * *'
  # disabled for now to avoid running on PRs
  # push:
  #   branches:
  #     - "pull-request/[0-9]+"
  workflow_dispatch:
    inputs:
      suite:
        description: "GPU test suite to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - smoke
          - e2e

defaults:
  run:
    shell: bash -x -e -u -o pipefail {0}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'workflow_dispatch'
    runs-on: linux-amd64-cpu4
    outputs:
      src_test_deps: ${{ steps.changes.outputs.src_test_deps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect changes
        id: changes
        uses: ./.github/actions/detect-changes

  # ---------------------------------------------------------------------------
  # Fill the uv download cache on a CPU runner before the GPU jobs start.
  #
  # GPU jobs restore one uv cache entry per CUDA extra (see
  # setup-gpu-test-env). When that entry is missing -- the first run after a
  # pyproject.toml change, or after eviction -- every GPU job downloads ~280
  # packages, and on slow nights that has run past the 60-minute GPU job
  # timeout while holding an A100. This job does the download once per CUDA
  # extra, for every smoke-test Python version, with a longer timeout. On a
  # cache hit it only looks the entry up and exits.
  # ---------------------------------------------------------------------------
  warm-uv-cache:
    name: Warm uv cache (${{ matrix.cuda-extra }})
    needs: changes
    if: >-
      ${{
        always() &&
        (
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.src_test_deps == 'true'
        )
      }}
    timeout-minutes: 120
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
      actions: read # look up existing cache entries
    strategy:
      fail-fast: false
      matrix:
        cuda-extra: [cu129, cu130]
    env:
      # Keep in sync with the gpu-smoke-test matrix. Torch wheels are built per
      # Python version, so each version is installed once to cache its wheels.
      PYTHON_VERSIONS: "3.11 3.12 3.13 3.14"
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # uv-dynamic-versioning reads the wheel version from git tags.
          fetch-depth: 0

      # GPU jobs install with the mise-pinned uv; use the same version so the
      # cache layout matches. The uv version is not part of the cache key.
      - name: Read pinned uv version
        id: uv-version
        run: echo "version=$(sed -n 's/^uv = "\(.*\)"$/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"

      # The inputs that feed the cache key (enable-cache, cache-suffix,
      # cache-dependency-glob, and no python-version) must match
      # setup-gpu-test-env exactly, or this job fills a key the GPU jobs never
      # read. Saving is off here; the save happens in a second setup-uv step
      # that runs only on a miss, so a hit never uploads an empty cache.
      - name: Compute uv cache key
        id: uv-key
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true
          restore-cache: false
          save-cache: false
          cache-suffix: ${{ matrix.cuda-extra }}
          cache-dependency-glob: |
            .python-version
            pyproject.toml

      # Checked through the API rather than by restoring, so a hit costs
      # seconds instead of a multi-GB download.
      - name: Look up cache entry
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.uv-key.outputs.cache-key }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: |
          # GPU jobs can restore entries saved on this ref or the default branch.
          matches=$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=${CACHE_KEY}" \
            --jq '[.actions_caches[] | select(.key == env.CACHE_KEY and (.ref == env.GITHUB_REF or .ref == "refs/heads/" + env.DEFAULT_BRANCH))] | length')
          if (( matches > 0 )); then
            echo "Cache entry exists for ${CACHE_KEY}; nothing to warm."
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable saving the uv cache
        if: steps.lookup.outputs.hit != 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ steps.uv-version.outputs.version }}
          enable-cache: true
          restore-cache: false
          cache-suffix: ${{ matrix.cuda-extra }}
          cache-dependency-glob: |
            .python-version
            pyproject.toml

      - name: Build wheel
        if: steps.lookup.outputs.hit != 'true'
        run: |
          rm -rf dist/
          uv build --wheel

      # Same install as setup-gpu-test-env, once per Python version. No GPU is
      # needed to download and install; only the CUDA check there needs one.
      - name: Download GPU dependencies into the uv cache
        if: steps.lookup.outputs.hit != 'true'
        env:
          CUDA: ${{ matrix.cuda-extra }}
          NSS_INSTALLER_ISOLATED: "1"
          PRIVATE_DEP_GROUPS: "test"
        run: |
          shopt -s nullglob
          wheels=("${GITHUB_WORKSPACE}"/dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "Error: expected exactly one wheel under ${GITHUB_WORKSPACE}/dist, found ${#wheels[@]}" >&2
            exit 1
          fi

          venv="${RUNNER_TEMP}/warm-uv-cache-venv"
          for python_version in ${PYTHON_VERSIONS}; do
            uv --no-config venv --clear --python "${python_version}" "${venv}"
            UV_PROJECT_ENVIRONMENT="${venv}" PACKAGE_WHEEL="${wheels[0]}" \
              "${GITHUB_WORKSPACE}/install_nss.sh"
            rm -rf "${venv}"
          done

  gpu-smoke-test:
    name: GPU Smoke Tests (Python ${{ matrix.python-version }}, ${{ matrix.cuda-extra }})
    # warm-uv-cache only fills the cache; if it fails, GPU jobs still run and
    # download what they need (`always()` below).
    needs: [changes, warm-uv-cache]
    # `changes` is intentionally skipped on workflow_dispatch. `always()` lets
    # manual runs bypass that skipped dependency and run the selected GPU suite.
    if: >-
      ${{
        always() &&
        (
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.src_test_deps == 'true'
        ) &&
        (
          github.event_name != 'workflow_dispatch' ||
          inputs.suite == 'all' ||
          inputs.suite == 'smoke'
        )
      }}
    timeout-minutes: 60
    runs-on: linux-amd64-gpu-a100-latest-1
    # Non-required until a run of green nightly cu130 results validates the rollout;
    # container-build and e2e coverage already exist (see docs/developer-guide/docker.md).
    continue-on-error: ${{ matrix.cuda-extra == 'cu130' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        cuda-extra: [cu129, cu130]
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup GPU test environment
        uses: ./.github/actions/setup-gpu-test-env
        with:
          python-version: ${{ matrix.python-version }}
          cuda-extra: ${{ matrix.cuda-extra }}

      - name: Run GPU unit tests
        timeout-minutes: 30
        # Authenticated Hub downloads get a higher rate limit than anonymous ones.
        # Scoped to test steps so checkout and setup actions never see the token.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: mise -E gpu-ci run test:unit:gpu

      - name: Run GPU smoke tests - train only
        timeout-minutes: 10
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: mise -E gpu-ci run test:smoke:gpu:train-only

      - name: Run GPU smoke tests - generation
        timeout-minutes: 10
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: mise -E gpu-ci run test:smoke:gpu:generation

      - name: Run GPU smoke tests - resume
        timeout-minutes: 10
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: mise -E gpu-ci run test:smoke:gpu:resume

      - name: Run GPU smoke tests - structured generation
        timeout-minutes: 10
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: mise -E gpu-ci run test:smoke:gpu:structured-generation

      - name: Run GPU smoke tests - timeseries
        timeout-minutes: 10
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: mise -E gpu-ci run test:smoke:gpu:timeseries

      - name: Run GPU smoke tests - SmolLM2
        timeout-minutes: 20
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: mise -E gpu-ci run test:smoke:gpu:smollm2

  gpu-e2e-test:
    name: GPU E2E Tests (${{ matrix.cuda-extra }})
    needs: [changes, warm-uv-cache]
    outputs:
      cu129_result: ${{ steps.record_result.outputs.cu129_result }}
      cu130_result: ${{ steps.record_result.outputs.cu130_result }}
    # `changes` is intentionally skipped on workflow_dispatch. `always()` lets
    # manual runs bypass that skipped dependency and run the selected GPU suite.
    if: >-
      ${{
        always() &&
        (
          github.event_name == 'workflow_dispatch' ||
          needs.changes.outputs.src_test_deps == 'true'
        ) &&
        (
          github.event_name != 'workflow_dispatch' ||
          inputs.suite == 'all' ||
          inputs.suite == 'e2e'
        )
      }}
    timeout-minutes: 210
    runs-on: linux-amd64-gpu-a100-latest-1
    # Job-level (not step-level) so a failed non-required leg still reports
    # conclusion "failure" in the jobs API, which notify-slack reads.
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            cuda-extra: cu129
            required: true
          # Non-required until a run of green nightly cu130 results validates the rollout;
          # container-build and e2e coverage already exist (see docs/developer-guide/docker.md).
          - python-version: "3.13"
            cuda-extra: cu130
            required: false
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup GPU test environment
        uses: ./.github/actions/setup-gpu-test-env
        with:
          python-version: ${{ matrix.python-version }}
          cuda-extra: ${{ matrix.cuda-extra }}

      - name: Run GPU E2E tests
        id: e2e_tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: mise run test:e2e:prepared
        timeout-minutes: 190

      - name: Record GPU E2E result
        id: record_result
        if: always()
        env:
          # job.status, not steps.e2e_tests.outcome, so checkout or setup
          # failures also count; job-level continue-on-error only applies
          # after the job finishes.
          E2E_RESULT: ${{ job.status }}
        run: echo "${{ matrix.cuda-extra }}_result=${E2E_RESULT}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Single required status check for branch protection.
  # Smoke tests are required; E2E failures produce a warning but don't block.
  # ---------------------------------------------------------------------------
  gpu-ci-status:
    name: GPU CI Status
    if: always() && !cancelled()
    needs: [changes, gpu-smoke-test, gpu-e2e-test]
    runs-on: linux-amd64-cpu4
    steps:
      - name: Check job results
        run: |
          echo "changes:        ${{ needs.changes.result }}"
          echo "gpu-smoke-test: ${{ needs.gpu-smoke-test.result }}"
          echo "gpu-e2e-test:   ${{ needs.gpu-e2e-test.result }}"
          echo "gpu-e2e-cu129:  ${{ needs.gpu-e2e-test.outputs.cu129_result }}"
          echo "gpu-e2e-cu130:  ${{ needs.gpu-e2e-test.outputs.cu130_result }}"

          if [[ "${{ needs.changes.result }}" == "failure" ]]; then
            echo "::error::Change detection failed"
            exit 1
          fi

          if [[ "${{ needs.gpu-smoke-test.result }}" == "failure" ]]; then
            echo "::error::GPU smoke tests failed (required)"
            exit 1
          fi

          if [[ "${{ needs.gpu-e2e-test.result }}" == "failure" ||
                "${{ needs.gpu-e2e-test.outputs.cu129_result }}" == "failure" ||
                "${{ needs.gpu-e2e-test.outputs.cu130_result }}" == "failure" ]]; then
            echo "::warning::GPU E2E tests failed (informational, does not block merge)"
          fi

          echo "All required GPU jobs passed (or were skipped)."

  # ---------------------------------------------------------------------------
  # Post to Slack when any job in a nightly run fails, times out, or is
  # cancelled. Job names come from the GitHub API, so new matrix entries (e.g.
  # another CUDA version) are picked up without changes here. Non-required
  # legs must use job-level continue-on-error: a step-level one makes the API
  # report the job as successful. Manual dispatches are skipped because whoever
  # triggered them is watching.
  #
  # Requires the SLACK_GPU_TESTS_WEBHOOK_URL secret: the trigger URL of a Slack
  # Workflow Builder workflow ("From a webhook") that posts to
  # #swdl-nemollm-safe-synthesizer. It must declare Text variables named
  # branch, run_url, and failed_jobs; the message text lives in Slack.
  # ---------------------------------------------------------------------------
  notify-slack:
    name: Notify Slack on failure
    if: always() && !cancelled() && github.event_name == 'schedule'
    needs: [changes, gpu-smoke-test, gpu-e2e-test, gpu-ci-status]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Post failed jobs to Slack
        env:
          GH_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_GPU_TESTS_WEBHOOK_URL }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed_jobs=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs" \
            --jq '.jobs[]
              | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out")
              | "• " + .name')

          if [[ -z "${failed_jobs}" ]]; then
            echo "No failed jobs; skipping Slack notification."
            exit 0
          fi

          jq -n --arg branch "${BRANCH}" --arg run_url "${RUN_URL}" --arg failed_jobs "${failed_jobs}" \
            '{branch: $branch, run_url: $run_url, failed_jobs: $failed_jobs}' \
            | curl -fsS --retry 3 -H 'Content-Type: application/json' --data @- "${SLACK_WEBHOOK_URL}"

name: Fern Docs Preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fern-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fern-preview:
    name: Fern Preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python environment and mise tools
        uses: ./.github/actions/setup-python-env
        with:
          checkout: "false"
          bootstrap-tools: "true"
      - name: Validate configuration and MDX
        run: mise run docs:fern:check
      - name: Generate hosted preview
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: mise run docs:fern:preview

version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # constraints.txt is generated from [tool.uv] constraint-dependencies in pyproject.toml
    # via tools/patch_dependabot.py; do not update it independently.
    exclude-paths:
      - "constraints.txt"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # FW-CI reusable workflows are pinned to immutable commits.
      - dependency-name: "NVIDIA-NeMo/FW-CI-templates"
    groups:
      github-actions:
        patterns:
          - "actions/*"
          - "astral-sh/*"
          - "codecov/*"

name: "Detect Changes"
description: >
  Detect which file categories changed using dorny/paths-filter.
  Outputs boolean flags that downstream jobs use to decide whether to run.

outputs:
  src:
    description: "'true' if any file under src/ changed"
    value: ${{ steps.filter.outputs.src }}
  docs_src:
    description: "'true' if docs source/config files changed"
    value: ${{ steps.filter.outputs.docs_src }}
  tests:
    description: "'true' if any file under tests/ changed"
    value: ${{ steps.filter.outputs.tests }}
  pytest_ini:
    description: "'true' if pytest.ini changed"
    value: ${{ steps.filter.outputs.pytest_ini }}
  pyproject:
    description: "'true' if pyproject.toml changed"
    value: ${{ steps.filter.outputs.pyproject }}
  uv_lock:
    description: "'true' if uv.lock changed"
    value: ${{ steps.filter.outputs.uv_lock }}
  test:
    description: "'true' if any file under tests/ or pytest.ini changed"
    value: ${{ steps.filter.outputs.tests == 'true' || steps.filter.outputs.pytest_ini == 'true' }}
  deps:
    description: "'true' if any dep related files changed"
    value: ${{ steps.filter.outputs.pyproject == 'true' || steps.filter.outputs.uv_lock == 'true' }}
  src_test:
    description: "'true' if source or test files changed"
    value: ${{ steps.filter.outputs.src == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.pytest_ini == 'true' }}
  src_test_deps:
    description: "'true' if source, test, dependency, CI, or task files changed"
    value: ${{ steps.filter.outputs.src == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.pytest_ini == 'true' || steps.filter.outputs.pyproject == 'true' || steps.filter.outputs.uv_lock == 'true' || steps.filter.outputs.ci == 'true' }}
  ci:
    description: "'true' if CI workflow, action, or mise task files changed"
    value: ${{ steps.filter.outputs.ci }}
  any:
    description: "'true' if any source, docs source, test, dependency, CI, or task file changed"
    value: ${{ steps.filter.outputs.src == 'true' || steps.filter.outputs.docs_src == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.pytest_ini == 'true' || steps.filter.outputs.pyproject == 'true' || steps.filter.outputs.uv_lock == 'true' || steps.filter.outputs.ci == 'true' }}

runs:
  using: "composite"
  steps:
    # Requires actions/checkout to have been run first so that
    # (a) this action.yml can be found, and
    # (b) dorny/paths-filter can diff against git history on push events.
    - name: Detect changed paths
      id: filter
      uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
      with:
        filters: |
          src:
            - 'src/**'
          docs_src:
            - 'docs/*.py'
            - 'docs/**/*.py'
            - 'mkdocs.yml'
          tests:
            - 'tests/**'
          pyproject:
            - 'pyproject.toml'
          uv_lock:
            - 'uv.lock'
          pytest_ini:
            - 'pytest.ini'
          ci:
            - '.github/workflows/**'
            - '.github/actions/**'
            - '.mise.toml'
            - '.mise.*.toml'
            - '.mise/tasks/**'
            - '.dockerignore'
            - 'containers/Dockerfile.test_ci'
            - 'tools/release_version.py'

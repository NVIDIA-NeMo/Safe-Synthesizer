name: "Setup GPU Test Environment"
description: "Build and install the wheel with unpinned GPU dependencies, test tools, and GPU validation"

inputs:
  python-version:
    description: "Python version to use (defaults to .python-version when empty)"
    required: false
    default: ""
  bootstrap-tools:
    description: "Whether to install dev tools via mise"
    required: false
    default: "true"
  cuda-extra:
    description: "CUDA dependency extra to install from the built wheel"
    required: false
    default: "cu129"

runs:
  using: "composite"
  steps:
    - name: Setup uv cache
      uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      with:
        enable-cache: true
        cache-dependency-glob: |
          .python-version
          pyproject.toml

    - name: Setup Python environment
      uses: ./.github/actions/setup-python-env
      with:
        checkout: "false"
        python-version: ${{ inputs.python-version }}
        bootstrap-tools: ${{ inputs.bootstrap-tools }}

    - name: Build wheel
      shell: bash
      run: mise run build-wheel

    - name: Install wheel with unpinned GPU dependencies
      shell: bash
      env:
        CUDA_EXTRA: ${{ inputs.cuda-extra }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        wheels=("${GITHUB_WORKSPACE}"/dist/*.whl)
        if (( ${#wheels[@]} != 1 )); then
          echo "Error: expected exactly one wheel under ${GITHUB_WORKSPACE}/dist, found ${#wheels[@]}" >&2
          exit 1
        fi

        wheel="${wheels[0]}"
        venv_path="${UV_PROJECT_ENVIRONMENT:-${GITHUB_WORKSPACE}/.venv}"
        uv --no-config venv --clear --python "${PYTHON_VERSION}" "${venv_path}"
        python_bin="${venv_path}/bin/python"

        index_args=()
        index_count=0
        while IFS= read -r url; do
          [[ -n "${url}" ]] || continue
          index_args+=(--index "${url}")
          index_count=$((index_count + 1))
          echo "CUDA index: ${url}"
        done < <("${python_bin}" - "${GITHUB_WORKSPACE}/pyproject.toml" "${CUDA_EXTRA}" <<'PY'
        import sys
        import tomllib

        with open(sys.argv[1], "rb") as handle:
            uv_config = tomllib.load(handle)["tool"]["uv"]

        indexes = uv_config["index"]
        cuda_extra = sys.argv[2]

        # Some indexes are reached only through [tool.uv.sources] and carry no
        # CUDA variant in their name or URL (flashinfer-cubin serves a single
        # https://flashinfer.ai/whl/ for every extra). We pass --no-sources
        # below, so collect those by their declared extra or they are dropped.
        source_indexes = {
            entry["index"]
            for value in uv_config.get("sources", {}).values()
            for entry in (value if isinstance(value, list) else [value])
            if isinstance(entry, dict)
            and entry.get("extra") == cuda_extra
            and "index" in entry
        }

        print(
            "\n".join(
                index["url"]
                for index in indexes
                if index["name"].endswith(f"-{cuda_extra}")
                or f"/{cuda_extra}" in index["url"]
                or index["name"] in source_indexes
            )
        )
        PY
        )

        if (( index_count < 3 )); then
          echo "Error: expected 3+ ${CUDA_EXTRA} indexes in pyproject.toml, found ${index_count}" >&2
          exit 1
        fi

        uv --no-config pip install \
          --python "${python_bin}" \
          --no-sources \
          --default-index https://pypi.org/simple \
          "${index_args[@]}" \
          --index-strategy unsafe-best-match \
          "nemo-safe-synthesizer[${CUDA_EXTRA},engine] @ file://${wheel}" \
          "pytest>=9.0.3" \
          "pytest-asyncio>=0.24.0" \
          "pytest-cov>=6.0.0" \
          "pytest-env>=1.1.0" \
          "pytest-subtests>=0.13.1" \
          "pytest-timeout>=2.3.1" \
          "pytest-xdist>=3.5.0"

        uv --no-config pip check --python "${python_bin}"
        "${python_bin}" -c \
          "from importlib.metadata import version; from nemo_safe_synthesizer.package_info import __version__; assert __version__ == version('nemo-safe-synthesizer')"
        "${python_bin}" - <<'PY'
        try:
            import torch
        except ImportError:
            raise SystemExit("GPU CI requires PyTorch with CUDA support, but PyTorch could not be imported.") from None

        if not torch.cuda.is_available():
            raise SystemExit("GPU CI requires CUDA, but torch.cuda.is_available() returned false.")

        print("cuda available: true")
        print("device count:", torch.cuda.device_count())
        PY

        echo "UV_PROJECT_ENVIRONMENT=${venv_path}" >> "${GITHUB_ENV}"
        echo "UV_NO_SYNC=1" >> "${GITHUB_ENV}"

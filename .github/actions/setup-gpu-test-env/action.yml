name: "Setup GPU Test Environment"
description: "Build and install the wheel with unpinned GPU dependencies, test tools, and GPU validation"

inputs:
  python-version:
    description: "Python version to use (defaults to .python-version when empty)"
    required: false
    default: ""
  bootstrap-tools:
    description: "Whether to install dev tools via mise"
    required: false
    default: "true"
  cuda-extra:
    description: "CUDA dependency extra to install from the built wheel"
    required: false
    default: "cu129"

runs:
  using: "composite"
  steps:
    - name: Setup uv cache
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        cache-dependency-glob: |
          .python-version
          pyproject.toml

    - name: Setup Python environment
      uses: ./.github/actions/setup-python-env
      with:
        checkout: "false"
        python-version: ${{ inputs.python-version }}
        bootstrap-tools: ${{ inputs.bootstrap-tools }}

    - name: Build wheel
      shell: bash
      run: mise run build-wheel

    - name: Install wheel with unpinned GPU dependencies
      shell: bash
      env:
        CUDA: ${{ inputs.cuda-extra }}
        NSS_INSTALLER_ISOLATED: "1"
        # Install test dependencies from the package's pyproject.toml, but use the wheel to install the package.
        PRIVATE_DEP_GROUPS: "test"
      run: |
        set -euo pipefail
        shopt -s nullglob
        wheels=("${GITHUB_WORKSPACE}"/dist/*.whl)
        if (( ${#wheels[@]} != 1 )); then
          echo "Error: expected exactly one wheel under ${GITHUB_WORKSPACE}/dist, found ${#wheels[@]}" >&2
          exit 1
        fi

        wheel="${wheels[0]}"
        export UV_PROJECT_ENVIRONMENT="${UV_PROJECT_ENVIRONMENT:-${GITHUB_WORKSPACE}/.venv}"
        uv --no-config venv --clear --python "${PYTHON_VERSION}" "${UV_PROJECT_ENVIRONMENT}"
        PACKAGE_WHEEL="${wheel}" \
          "${GITHUB_WORKSPACE}/install_nss.sh"
        python_bin="${UV_PROJECT_ENVIRONMENT}/bin/python"

        "${python_bin}" -c \
          "from importlib.metadata import version; from nemo_safe_synthesizer.package_info import __version__; assert __version__ == version('nemo-safe-synthesizer')"
        "${python_bin}" - <<'PY'
        try:
            import torch
        except ImportError:
            raise SystemExit("GPU CI requires PyTorch with CUDA support, but PyTorch could not be imported.") from None

        if not torch.cuda.is_available():
            raise SystemExit("GPU CI requires CUDA, but torch.cuda.is_available() returned false.")

        print("cuda available: true")
        print("device count:", torch.cuda.device_count())
        PY

        echo "UV_PROJECT_ENVIRONMENT=${UV_PROJECT_ENVIRONMENT}" >> "${GITHUB_ENV}"
        echo "UV_NO_SYNC=1" >> "${GITHUB_ENV}"

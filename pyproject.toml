[tool.uv]
# Version pinned in .mise.toml but keep here as a fallback constraint
# Allow current 0.9.x line while staying below 0.10.0
required-version = ">=0.9.30, <0.10.0"

cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
    { file = "uv.lock" },
]
# >>> BEGIN GENERATED CUDA UV CONFLICTS - DO NOT EDIT <<<
# Source of truth: cuda_deps.toml.
# Regenerate with: uv run --frozen tools/gen_cuda_deps.py cuda_deps.toml --pyproject pyproject.toml --installer install_nss.sh
# Manual edits inside this block will be overwritten.
# Generated uv section: tool.uv.conflicts.
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu129" },
        { extra = "cu130" },
    ],
]
# <<< END GENERATED CUDA UV CONFLICTS - DO NOT EDIT >>>

environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    # we have to add the following to make the right python packages for linux
    # for downstream use in our linux/arm64 docker images.
    # there's subtle differences in the naming convention on the python side
    # even though they are the same architecture, so we use aarch64
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

constraint-dependencies = [
    "GitPython>=3.1.50",
    "PyJWT>=2.13.0",
    "Pygments>=2.20.0",
    "aiohttp>=3.14.0",
    "bleach>=6.4.0",
    "cbor2>=5.9.0",

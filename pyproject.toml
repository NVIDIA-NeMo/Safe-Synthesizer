[project]
name = "nemo-safe-synthesizer"
dynamic = ["version"]
description = "Safe synthesizer"
readme = "README.md"
authors = [{ name = "NVIDIA", email = "nemo@nvidia.com" }]
requires-python = ">=3.11, <3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
  "Topic :: Software Development",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]


dependencies = [
  "faker>=20.0",
  "httpx>=0.27.0",
  "huggingface-hub>=1.3.0,<2",
  "pandas>=2.1.3",
  "pydantic[email]>=2.12.5",
  "pydantic-settings>=2.6.1",
  "pyyaml>=6.0.1",
  "jsonschema>=4.22.0",
  "rich>=14.1.0",
  "structlog>=25.4.0",
  "colorama>=0.4.6",
  "tqdm>=4.67.1",
  "setuptools>=80.0.0",
]

[dependency-groups]
dev = [
  "ipywidgets",
  "jupyterlab-widgets",
  "pandas-stubs>=2.1.3",
  "prek>=0.3.1",
  "packaging>=25.0.0",
  "typer>=0.15.0",
  "types-click",
  "types-colorama>=0.4.6",
  "textual",
  "tomlkit>=0.13.0",
  # for the proxy tool used to monitor calls to HF during testing
  "proxy-py>=2.4.10",
  {include-group = "docs"},
  {include-group = "test"},
]

docs = [
  "mike",
  "mkdocs-material",
  "mkdocstrings[python]",
  "griffe-pydantic",
  "mkdocs-gen-files",
  "mkdocs-literate-nav",
  "mkdocs-jupyter",
]

test = [
  "pytest>=9.0.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "pytest-env>=1.1.0",
  "pytest-subtests>=0.13.1",
  "pytest-timeout>=2.3.1",
  "pytest-xdist>=3.5.0",
]

[project.optional-dependencies]

engine = [
    "anyascii",
    "pycountry",
    "betterproto",
    "flashtext",
    "cached-property",
    "category-encoders",
    "dython",
    "dateparser",
    "faker",
    "datasets>=4.8.4",
    "huggingface-hub>=1.3.0,<2",
    "json-repair",
    "matplotlib",
    "outlines>=1.0.0",
    "prv-accountant",
    "smart-open==7.0.5",
    "python-stdnum",
    "pandas>=2.1.3, <3",
    "plotly",
    "ratelimit",
    "scikit-learn",
    "range_regex>=0.1.0",
    "tenacity==9.1.4",
    "tiktoken>=0.7.0,<1.0",
    "tldextract",
    "tqdm>=4.67.1",
    "urllib3>=2.7.0",
    "wandb==0.26.1",
]


# the following are deps that have Torch as a dep. We keep them separated out from the engine deps
#
# it's a little annoying to have to split them up like this with redundant bits.
# it allows us to have a cpu and a cuda version of torch+deps
# and allow explicit installation of the cpu depset on linux.

cpu = [
  "accelerate>=1.1.0",
  "bitsandbytes>=0.46.1",
  "flashinfer-python==0.6.8.post1; sys_platform=='linux'",
  "flashinfer-cubin==0.6.8.post1; sys_platform=='linux'",
  "gliner",
  "kernels>=0.12.1,<0.15",
  "peft>=0.18.0",
  "opacus",
  "sentence-transformers",
  "torch==2.11.0; sys_platform == 'darwin'",
  "torch==2.11.0+cpu; sys_platform == 'linux'",
  "torchaudio==2.11.0; sys_platform == 'darwin'",
  "torchaudio==2.11.0+cpu; sys_platform == 'linux'",
  "torchvision==0.26.0; sys_platform == 'darwin'",
  "torchvision==0.26.0+cpu; sys_platform == 'linux'",
  "torchao==0.17.0",
  "transformers>=5.6,<6",
  "triton>=2.0.0; sys_platform=='linux'",
  "trl>=0.23.0",
  "vllm==0.20.0; sys_platform=='linux'",
  "xgrammar>=0.2.0; sys_platform=='linux'",
]

cu129 = [
  "accelerate>=1.1.0",
  "bitsandbytes>=0.46.1",
  "flashinfer-python==0.6.8.post1; sys_platform == 'linux'",
  "flashinfer-cubin==0.6.8.post1; sys_platform == 'linux'",
  "flashinfer-jit-cache==0.6.8.post1+cu129; sys_platform == 'linux'",
  "gliner",
  "kernels>=0.12.1,<0.15",
  "nvidia-cublas-cu12; sys_platform == 'linux'",
  "nvidia-ml-py; sys_platform == 'linux'",
  "opacus",
  "peft>=0.18.0",
  "sentence-transformers",
  "torch==2.11.0+cu129; sys_platform == 'linux'",
  "torch-c-dlpack-ext",
  "torchaudio==2.11.0+cu129; sys_platform == 'linux'",
  "torchvision==0.26.0+cu129; sys_platform == 'linux'",
  "torchao==0.17.0+cu129; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "transformers>=5.6,<6",
  "triton>=2.0.0; sys_platform == 'linux'",
  "trl>=0.23.0",
  "vllm==0.20.0+cu129; sys_platform == 'linux'",
  "xgrammar>=0.2.0; sys_platform == 'linux'",
]

# at some point, do per-subpackage dependencies

[tool.uv]
# Version pinned in .mise.toml but keep here as a fallback constraint
# Allow current 0.9.x line while staying below 0.10.0
required-version = ">=0.9.30, <0.10.0"


cache-keys = [
  { file = "pyproject.toml" }, { git = { commit = true, tags = true } },
  { file = "uv.lock" }
]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu129" },
  ],
]


override-dependencies = [
    "flashinfer-python==0.6.8.post1; sys_platform != 'darwin'",
    "flashinfer-cubin==0.6.8.post1; sys_platform != 'darwin'",
]

environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    # we have to add the following to make the right python packages for linux
    # for downstream use in our linux/arm64 docker images.
    # there's subtle differences in the naming convention on the python side
    # even though they are the same architecture, so we use aarch64
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

constraint-dependencies = [
    "GitPython>=3.1.50",
    "PyJWT>=2.12.0",
    "Pygments>=2.20.0",
    "aiohttp>=3.13.4",
    "cbor2>=5.9.0",
    "cryptography>=46.0.7",
    "grpcio>=1.80.0",
    "idna>=3.15",
    "langchain-core>=1.2.28",
    "langsmith>=0.7.31",
    "mistune>=3.2.1",
    "nbconvert>=7.17.1",
    "pandas<3",
    "pillow>=12.2.0",
    "pymdown-extensions>=10.21.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "requests>=2.33.0",
    "tornado>=6.5.5",
    "jsonpath-ng>=1.8.0",
]



[tool.uv.sources]
  # here we specifiy the dep's source from which UV should attempt to resolve
  triton = { index = "pytorch-cu129", extra = "cu129" }
  vllm = [
    { index = "vllm-v0-20-0-cu129", marker = "sys_platform == 'linux'", extra = "cu129" },
  ]
# for torch - we have a "cpu" dep set and "cu129" dep set, specified in the optional dependencies above
  torch = [
    { index = "pytorch-cpu", extra="cpu", marker = "sys_platform=='linux'"},
    { index = "pytorch-cu129", extra="cu129"},
  ]
  torchao = [
    { index = "pytorch-cu129", extra="cu129"},
  ]
  torchvision = [
    { index = "pytorch-cpu", extra="cpu" },
    { index = "pytorch-cu129", extra="cu129"},
  ]
  torchaudio = [
    { index = "pytorch-cpu", extra="cpu" },
    { index = "pytorch-cu129", extra="cu129"},
  ]
  flashinfer-python = [
    { index = "flashinfer-jit-cache", marker = "sys_platform=='linux'", extra="cu129"},
  ]
  flashinfer-cubin = [
    { index = "flashinfer-jit-cache", marker = "sys_platform=='linux'", extra="cu129"},
  ]
  flashinfer-jit-cache = [
    { index = "flashinfer-jit-cache", marker = "sys_platform=='linux'", extra="cu129"},
  ]
  nvidia-cublas-cu12 = [
    { index = "pytorch-cu129" },
  ]
  nvidia-cuda-cupti-cu12 = [
    { index = "pytorch-cu129" },
  ]
  nvidia-cuda-nvrtc-cu12 = [
    { index = "pytorch-cu129" },
  ]
  nvidia-cuda-nvprof-cu12 = [
    { index = "pytorch-cu129" },
  ]

  nvidia-cuda-runtime-cu12 = [
    { index = "pytorch-cu129" },
  ]

  nvidia-cuda-nvml-cu12 = [
    { index = "pytorch-cu129" },
  ]


  nvidia-cudnn-cu12 = [
    { index = "pytorch-cu129" },
  ]
  nvidia-cusparse-cu12 = [
    { index = "pytorch-cu129" },
  ]
  nvidia-cusparselt-cu12 = [
    { index = "pytorch-cu129" },
  ]
  nvidia-nccl-cu12 = [
    { index = "pytorch-cu129" },
  ]
  nvidia-nvjitlink-cu12 = [
    { index = "pytorch-cu129" },
  ]
  nvidia-nvshmem-cu12 = [
    { index = "pytorch-cu129" },
  ]
  nvidia-nvtx-cu12 = [
    { index = "pytorch-cu129" },
  ]


[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

# required for linux cpu - it's got a `+cpu` on the version
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "nv-shared-pypi-local"
url = "https://urm.nvidia.com/artifactory/api/pypi/nv-shared-pypi-local/simple"
explicit = true

[[tool.uv.index]]
name = "flashinfer-jit-cache"
url = "https://flashinfer.ai/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "vllm-v0-20-0-cu129"
url = "https://wheels.vllm.ai/88d34c6409e9fb3c7b8ca0c04756f061d2099eb1/cu129"
explicit = true

[[tool.uv.index]]
name = "nvidia-pypi-public"
url = "https://pypi.nvidia.com"
explicit = true


[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
# Fallback when no git tag is available (e.g. shallow clone, Dependabot)
fallback-version = "0.0.0"
vcs = "git"
style = "pep440"


[tool.hatch.build.targets.wheel]

packages = ["src/nemo_safe_synthesizer"]
# Include license files in wheel distribution
artifacts = [
  "LICENSE",
  "THIRD_PARTY.md",
]


[project.scripts]
safe-synthesizer = "nemo_safe_synthesizer.cli.cli:cli"


[tool.ty.rules]
# Platform-specific imports (e.g. vLLM on macOS) use ty: ignore[unresolved-import]
# that appear unused when the package is installed. Suppress the noise.
unused-ignore-comment = "ignore"

[tool.ty.environment]
extra-paths = ["typings"]

[tool.ty.src]
# Below is a list of excluded directories from ty typechecks.
exclude = [
    ".uv_cache", # Cache Dir in CI
    "./docs/**/*.ipynb",
    "./src/nemo_safe_synthesizer/pii_replacer/",
    "./tools/*.py"
]

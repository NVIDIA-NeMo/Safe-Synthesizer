[project]
name = "nemo-safe-synthesizer"
dynamic = ["version"]
description = "Safe synthesizer"
readme = "README.md"
authors = [{ name = "NVIDIA", email = "nemo@nvidia.com" }]
requires-python = ">=3.11, <3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Software Development",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "faker>=20.0",
    "httpx>=0.27.0",
    "huggingface-hub>=1.3.0,<2",
    "pandas>=2.1.3",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.1",
    "jsonschema>=4.22.0",
    "rich>=14.1.0",
    "structlog>=25.4.0",
    "colorama>=0.4.6",
    "tqdm>=4.67.1",
    "setuptools>=80.0.0",
    "typing-extensions>=4.15.0",
]

[dependency-groups]
dev = [
    "ipywidgets",
    "jupyterlab-widgets",
    "pandas-stubs>=2.1.3",
    "prek>=0.3.1",
    "packaging>=25.0.0",
    "typer>=0.15.0",
    "types-click",
    "types-colorama>=0.4.6",
    "textual",
    "tomlkit>=0.13.0",
    # for the proxy tool used to monitor calls to HF during testing
    "proxy-py>=2.4.10",
    { include-group = "docs" },
    { include-group = "test" },
]

docs = [
    "mike",
    "mkdocs-material",
    "mkdocstrings[python]",
    "griffe-pydantic",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-jupyter",
]

test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-env>=1.1.0",
    "pytest-subtests>=0.13.1",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.5.0",
]

[project.optional-dependencies]
engine = [
    "anyascii",
    "pycountry",
    "flashtext",
    "category-encoders",
    "dython",
    "dateparser",
    "faker",
    "datasets>=4.8.4",
    "huggingface-hub>=1.3.0,<2",
    "json-repair>=0.60.1",
    "outlines>=1.0.0",
    "prv-accountant",
    "python-stdnum",
    "pandas>=2.1.3, <3",
    "plotly",
    "scikit-learn",
    "range_regex>=0.1.0",
    "tenacity==9.1.4",
    "tldextract",
    "tqdm>=4.67.1",
    "wandb==0.28.0",
]


    {extra = "cu130"},
],
]
# <<< END GENERATED CUDA UV CONFLICTS - DO NOT EDIT >>>


override-dependencies = [
    "flashinfer-python==0.6.8.post1; sys_platform != 'darwin'",
    "flashinfer-cubin==0.6.8.post1; sys_platform != 'darwin'",
]

environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    # we have to add the following to make the right python packages for linux
    # for downstream use in our linux/arm64 docker images.
    # there's subtle differences in the naming convention on the python side
    # even though they are the same architecture, so we use aarch64
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

constraint-dependencies = [
    "GitPython>=3.1.47",
    "PyJWT>=2.12.0",
    "Pygments>=2.20.0",
    "aiohttp>=3.13.4",
    "cbor2>=5.9.0",
    "cryptography>=46.0.7",
    "grpcio>=1.80.0",
    "langchain-core>=1.2.28",
    "langsmith>=0.7.31",
    "nbconvert>=7.17.1",
    "pandas<3",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.26",
    "requests>=2.33.0",
    "tornado>=6.5.5",
]




[tool.uv]
# Version pinned in .mise.toml but keep here as a fallback constraint
# Allow current 0.9.x line while staying below 0.10.0
required-version = ">=0.9.30, <0.10.0"


cache-keys = [
  { file = "pyproject.toml" }, { git = { commit = true, tags = true } },
  { file = "uv.lock" }
]
